services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: Test_platform_db
      POSTGRES_USER: ilyes
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilyes"]
      interval: 5s
      timeout: 5s
      retries: 10

  eureka:
    image: backend-eurekaserveur:latest
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 90s

  auth:
    image: backend-authenticationmicroservice:latest
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/Test_platform_db
      SPRING_DATASOURCE_USERNAME: ilyes
      SPRING_DATASOURCE_PASSWORD: mypassword
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:8761/eureka/
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: "587"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 90s

  ms-gestion:
    image: backend-ms_gestion:latest
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/Test_platform_db
      SPRING_DATASOURCE_USERNAME: ilyes
      SPRING_DATASOURCE_PASSWORD: mypassword
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:8761/eureka/
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: "587"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  ms-execution:
    image: backend-ms-execution:latest
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
      ms-gestion:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/Test_platform_db
      SPRING_DATASOURCE_USERNAME: ilyes
      SPRING_DATASOURCE_PASSWORD: mypassword
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:8761/eureka/
      # CI uses a fresh database. ms-execution owns tables (reports, ux_evaluations,
      # ux_navigation_steps, evaluation_members, functional_test_results) that ms_gestion
      # does not create and whose SQL migration scripts are not run in CI. Use "update"
      # so Hibernate creates them; ms-gestion (starts first) creates the shared tables.
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  frontend:
    image: frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      auth:
        condition: service_healthy
      ms-gestion:
        condition: service_healthy
      ms-execution:
        condition: service_healthy
    environment:
      # Force Next.js standalone to bind all interfaces so the localhost healthcheck
      # works (Docker otherwise sets HOSTNAME to the container id).
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_API_URL: http://localhost:3000
      AUTH_SERVICE_URL: http://auth:8081
      MS_GESTION_SERVICE_URL: http://ms-gestion:8082
      MS_EXECUTION_SERVICE_URL: http://ms-execution:8083
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
