# UX Evaluation — moteur vision via Ollama Cloud (GRATUIT, 0 VRAM, vision confirmee)
# minimax-m3:cloud = teste OK gratuit + vision sur ce compte (testé 2026-06-19)
# Modeles cloud vision en abonnement (403) : qwen3.5, gemini-3-flash, kimi-k2.x
# Repli local si quota cloud epuise : llava-phi3:latest (2.9 Go) ou moondream:latest (1.7 Go)
ollama.vision.enabled=true
ollama.vision.url=http://localhost:11434/api/generate
ollama.vision.model=minimax-m3:cloud
# Modele texte pour le rapport final (minimax-m3 gere aussi le texte)
ollama.vision.text-model=minimax-m3:cloud

# Exploration UX adaptative (tour complet, pas de limite fixe)
# ux.max-steps = plafond de securite anti-boucle (pas une limite fonctionnelle)
ux.max-steps=60
# ux.saturation-threshold = nb d'etapes sans nouvelle decouverte avant de conclure le tour
ux.saturation-threshold=6

reports.storage.path=./data/reports


