[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-api-discovery"
version = "1.0.0"
description = "Production-ready pipeline for extracting OpenAPI specs from GitHub repositories"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = ["openapi", "swagger", "github", "api", "discovery", "ast", "tree-sitter"]

dependencies = [
    "tree-sitter>=0.20.0",
    "tree-sitter-language-pack>=0.5.0",
    "gitpython>=3.1.0",
    "openapi-spec-validator>=0.5.0",
    "jsonschema>=4.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "cachetools>=5.0.0",
    "networkx>=3.0",
    "tqdm>=4.65.0",
    "aiohttp>=3.8.0",
    "structlog>=23.0.0",
    "colorlog>=6.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
    "langchain>=0.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
github-api-discovery = "src.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true