spring.application.name=TestManagementMicroservice

# --- Database (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/Test_platform_db
spring.datasource.username=ilyes
spring.datasource.password=mypassword
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server port
server.port=8082

discovery.base-url=http://localhost:8000


# Runtime orchestration for campaign runs
run.api.base-url=http://127.0.0.1
run.api.health-path=/health

# Leave empty if you always send hostPortBase or use dynamic host port allocation
run.api.default-port=

run.api.health-timeout-seconds=180
run.api.health-poll-interval-ms=2000
run.compose.start-timeout-seconds=600
run.compose.cleanup-timeout-seconds=240

# If true, service allocates a free host port for compose host_port_base when not provided
run.dynamic-host-port-enabled=true
