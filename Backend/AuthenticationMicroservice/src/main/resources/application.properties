spring.application.name=AuthenticationMicroservice

# --- Database (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/Test_platform_db
spring.datasource.username=ilyes
spring.datasource.password=mypassword
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server port
server.port=8081

# --- JWT ---
security.jwt.
jwt.
jwt.expiration.ms=86400000 # 24 hours

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.shutdown-enabled=true

eureka.instance.prefer-ip-address=true

# -------------------------------
# GitHub OAuth (override via env)
# -------------------------------
github.oauth.client-id=${GITHUB_CLIENT_ID:}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET:}
# This must match the callback URL configured in your GitHub OAuth App
github.oauth.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8081/api/github/callback}
# Requested scopes for private repos + user profile
github.oauth.scope=${GITHUB_SCOPE:repo read:user user:email}

# Where the backend redirects after successful linking
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# AES-256 key for encrypting GitHub access tokens at rest (base64 of 32 bytes)
# Generate example (PowerShell):
#   [Convert]::ToBase64String((1..32 | ForEach-Object { Get-Random -Maximum 256 }))
app.crypto.github-token-key=Z6gct0+X9rVmwDsVLE7wfIPXoSlHzQHRNDgQjhs17Sc=

# Cookies
app.cookies.secure=${APP_COOKIES_SECURE:false}
app.cookies.same-site=${APP_COOKIES_SAMESITE:Lax}

# -------------------------------
# CORS (Frontend UI access)
# -------------------------------
# Comma-separated list of allowed origins (must not be '*' when credentials are used)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# -------------------------------
# External services
# -------------------------------
# api-scanner-service base URL (Option A: backend-to-backend call)
services.api-scanner.base-url=${API_SCANNER_SERVICE_URL:http://localhost:8099}
