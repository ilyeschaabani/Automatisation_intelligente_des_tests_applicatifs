[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockercompose-generator"
version = "0.1.0"
description = "Analyze a project and generate a structured docker-compose.yml (with DB + healthchecks), optionally using Ollama."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dockercompose Generator"}]
dependencies = [
  "typer>=0.12.3",
  "PyYAML>=6.0.1",
  "requests>=2.31.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
]

[project.scripts]
dcgen = "dcgenerator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
