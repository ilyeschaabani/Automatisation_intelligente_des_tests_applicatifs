spring.application.name=api-scanner-service
server.port=8099

# --- Logging (diagnostics) ---
logging.level.com.pfe.platform.apiscannerservice=INFO
logging.level.org.eclipse.jgit=INFO

# --- AI detector (Ollama) ---
# Enable AI fallback when heuristic detection returns UNKNOWN:
scanner.ai.enabled=true
# Ollama endpoint/model settings (used when scanner.ai.enabled=true)
scanner.ai.ollama.base-url=http://localhost:11434
scanner.ai.ollama.model=qwen2.5-coder:7b
scanner.ai.ollama.timeout=30s
