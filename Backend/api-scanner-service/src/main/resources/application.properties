# Default configuration for api-scanner-service
server.port=8080

# Ollama base URL
aicode.ollama.base-url=http://localhost:11434

# Ollama chat model (Option A: use an installed model)
aicode.chat-model=qwen2.5-coder:7b

# Analyzer limits (tune for large repos)
aicode.max-files=400
aicode.max-chunk-chars=2000
aicode.max-prompt-chars=24000
aicode.vector.top-k=8

# Git temp directory root (Windows-friendly; uses java.io.tmpdir by default)
aicode.git.temp-root=${java.io.tmpdir}
