<svg viewBox="0 0 1010 1150" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
<title>Diagramme de cas d'utilisation - Plateforme d'Automatisation des Tests</title>
<desc>Trois acteurs (Administrateur, Testeur/QA, Developpeur) interagissent avec les cas d'usage regroupes par domaine, et deux systemes externes (Service LLM et API GitHub).</desc>
<style>
  .ttl{fill:#1e293b;font-size:21px;font-weight:700}
  .pkg-lbl{fill:#334155;font-size:12.5px;font-weight:700;letter-spacing:.3px}
  .uc{fill:#1e3a8a;font-size:12.5px;text-anchor:middle}
  .act{fill:#1e293b;font-size:13px;font-weight:600;text-anchor:middle}
  .ext{fill:#92400e;font-size:12.5px;font-weight:700;text-anchor:middle}
  .ext-sub{fill:#64748b;font-size:10px;text-anchor:middle}
  .ster{fill:#64748b;font-size:10px;font-style:italic}
  .ln{fill:none;stroke-width:1.6;opacity:.85}
  .auth{fill:none;stroke:#94a3b8;stroke-width:1.3;stroke-dasharray:5 4;opacity:.6}
  .extln{fill:none;stroke-width:1.5;stroke-dasharray:6 4;opacity:.9}
  .rel{fill:none;stroke:#64748b;stroke-width:1.3;stroke-dasharray:4 3}
</style>

<defs>
